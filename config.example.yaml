# converse-tui configuration
#
# Default location:
#   Linux:   ~/.config/converse-tui/config.yaml
#   Windows: %AppData%\converse-tui\config.yaml
# Override with -config <path> or CONVERSE_TUI_CONFIG.
#
# Every value can also be set with an environment variable (shown in
# parentheses) or a CLI flag; flags win over env vars, env vars win over this file.
#
# AWS credentials are NOT configured here. They come from the normal AWS
# credential chain: `aws configure`, `aws sso login`, AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY, an EC2/ECS role, etc.

# AWS profile from ~/.aws/config. Empty = AWS_PROFILE or "default". (CONVERSE_TUI_PROFILE, -profile)
profile: ""

# AWS region. Empty = region from your profile or AWS_REGION. (CONVERSE_TUI_REGION, -region)
region: us-east-1

# Bedrock model ID or inference profile ID/ARN. Required. (CONVERSE_TUI_MODEL_ID, -model)
# List what your account can use with:
#   aws bedrock list-inference-profiles --query "inferenceProfileSummaries[].inferenceProfileId"
#   aws bedrock list-foundation-models --query "modelSummaries[].modelId"
model_id: ""

# Optional system prompt. (CONVERSE_TUI_SYSTEM_PROMPT)
system_prompt: "You are a helpful assistant. Be concise."

# Max response tokens. 0 = model default. (CONVERSE_TUI_MAX_TOKENS)
max_tokens: 8192

# Optional sampling temperature. Leave commented out unless you need it;
# newer Claude models reject this parameter. (CONVERSE_TUI_TEMPERATURE)
# temperature: 0.7

# Local file tools (list/read/write/edit files). Default: true. (CONVERSE_TUI_TOOLS, -no-tools)
tools: true

# Directory the tools may access. Empty = the directory you start converse-tui in.
# (CONVERSE_TUI_WORKDIR, -workdir)
workdir: ""

# Apply file edits without asking. Toggle in-app with Ctrl+T. (CONVERSE_TUI_AUTO_APPROVE, -auto)
auto_approve: false

# Mouse wheel scrolls the chat. While on, hold Shift to select/copy text with
# the mouse. Set false to restore normal mouse selection. (CONVERSE_TUI_MOUSE)
mouse: true

# --- Look & feel -----------------------------------------------------------

# Welcome banner. "text" is drawn as ASCII art in a FIGlet "font"
# (standard, slant, small, big, doom, banner, block, ...). Or paste your own
# ASCII art into "art" (it wins over text/font). Set show: false to hide it.
banner:
  show: true
  text: "converse"
  font: "standard"
  title: "Welcome to converse-tui"
  # art: |
  #    _  _ ___ _    _    ___
  #   | || | __| |  | |  / _ \
  #   | __ | _|| |__| |_| (_) |
  #   |_||_|___|____|____\___/

# Accent color for the banner, borders and highlights: hex ("#d97757") or an
# ANSI color number ("208").
accent_color: "#d97757"

# "dark" or "light" terminal background.
theme: dark

# Render replies as markdown (headings, lists, code blocks).
markdown: true
